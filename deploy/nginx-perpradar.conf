# /etc/nginx/sites-available/perpradar  — reverse proxy to the Node app on :4800.
# certbot --nginx adds the listen 443 / ssl_certificate lines + the port-80 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name perpradarhq.com www.perpradarhq.com;

    location / {
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
